<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Headline card</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body { font-family: var(--font-text); -webkit-font-smoothing: antialiased; }

  .card {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    padding: max(var(--margin), var(--safe-top)) max(var(--margin), var(--safe-right))
             max(var(--margin), var(--safe-bottom)) max(var(--margin), var(--safe-left));
    --fit: 1;
  }
  .g-dark { background: var(--dark); color: var(--on-dark); }
  .g-light { background: var(--light); color: var(--on-light); }
  .g-signature { background: var(--signature); color: var(--on-signature); }
  .g-surface { background: var(--surface); color: var(--on-surface); }

  .top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--margin); font-size: calc(var(--subhead) * 0.75); font-weight: 600; }
  .counter { font-family: var(--font-mono); opacity: 0.72; }
  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-start; gap: calc(var(--subhead) * 0.8); padding-top: calc(var(--subhead) * 1.2); }
  .f-16x9 .body { max-width: 70%; }
  .headline {
    font-family: var(--font-display); font-weight: var(--display-weight, 800);
    letter-spacing: var(--display-tracking, -0.02em);
    font-size: calc(var(--headline) * 1.25 * var(--fit)); line-height: 1.05;
  }
  :root[dir="rtl"] .headline { letter-spacing: 0; line-height: 1.35; }
  .text { font-size: calc(var(--subhead) * var(--fit)); line-height: 1.35; font-weight: 400; max-width: 30em; }
  /* The block covers cap height to descender only, so it never touches the line above. */
  .hl { color: var(--on-signature); box-shadow: inset 0 -0.98em 0 var(--signature); padding: 0 0.08em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  /* Arabic glyphs are taller and deeper: cover the whole line box instead. */
  :root[dir="rtl"] .hl { box-shadow: none; background: var(--signature); }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--margin); }
  .logo { height: var(--logo-h); width: auto; display: block; }
  .cta { font-size: calc(var(--subhead) * 0.75); font-weight: 600; text-align: end; }
  /* Brand places the logo at the end side: swap the logo and the call to action. */
  .bottom.logo-end { flex-direction: row-reverse; }
  .bottom.logo-end .cta { text-align: start; }
</style>
</head>
<body>
<script>
(() => {
  const C = window.CMO || { format: '1x1', page: 0, direction: 'ltr', data: { headline: 'Preview' }, brand: { logo: {}, tokens: {} } };
  document.body.classList.add(`f-${C.format}`);
  const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const d = C.data;
  const slides = Array.isArray(d.slides) && d.slides.length ? d.slides : null;
  // A slide inherits only the card's ground; everything else is per slide.
  const s = slides ? { ground: d.ground, ...slides[C.page] } : d;
  const total = slides ? slides.length : 1;
  const ground = s.ground || 'light';
  if (!s.headline) console.error(`cmo: ${slides ? `slide ${C.page + 1}` : 'the card'} has no headline`);

  let headline = esc(s.headline);
  if (s.highlight) {
    const p = esc(s.highlight);
    if (ground === 'signature') console.warn('cmo: highlight skipped on a signature ground');
    else if (headline.includes(p)) headline = headline.replace(p, () => `<span class="hl">${p}</span>`);
    else console.warn(`cmo: highlight "${s.highlight}" is not in the headline`);
  }
  const logo = ground === 'dark' ? C.brand.logo.white || C.brand.logo.black : C.brand.logo.black || C.brand.logo.white;
  const isLast = C.page === total - 1;
  const cta = d.cta && (isLast || !slides) ? d.cta : null;

  document.body.insertAdjacentHTML('beforeend', `
    <main class="card g-${ground}">
      <div class="top"><span>${esc(s.eyebrow)}</span>${total > 1 && d.show_counter !== false ? `<span class="counter">${C.page + 1} / ${total}</span>` : ''}</div>
      <div class="body">
        <h1 class="headline">${headline}</h1>
        ${s.body ? `<p class="text">${esc(s.body)}</p>` : ''}
      </div>
      <div class="bottom${C.brand.logo_side === 'end' ? ' logo-end' : ''}">${logo ? `<img class="logo" src="${logo}" alt="${esc(C.brand.name)}">` : '<span></span>'}${cta ? `<span class="cta">${esc(cta)}</span>` : '<span></span>'}</div>
    </main>`);
  window.PAGES = total;

  window.cmoReady = document.fonts.ready.then(() => {
    const card = document.querySelector('.card');
    const box = card.querySelector('.body');
    let fit = 1;
    const over = () => box.scrollHeight > box.clientHeight + 1 || box.scrollWidth > box.clientWidth + 1;
    while (over() && fit > 0.7) { fit -= 0.05; card.style.setProperty('--fit', fit.toFixed(2)); }
    const where = total > 1 ? `slide ${C.page + 1}` : 'card';
    if (over()) console.error(`cmo: ${where} text does not fit the ${C.format} format; shorten it`);
    else if (fit < 1) console.warn(`cmo: ${where} type reduced to ${Math.round(fit * 100)}% to fit ${C.format}`);
  });
})();
</script>
</body>
</html>
